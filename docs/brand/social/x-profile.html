<!doctype html>
<!-- X profile photo: the paper symbol on ink, as the app icon, sized for a circle crop. Render at 400x400. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0a0a0a; }
  .tile { width: 400px; height: 400px; display: grid; place-items: center; }
  /* The symbol's 40-unit grid at 60% of the tile: a little larger than the app icon's 55%,
     since there is no squircle margin and the avatar is often shown at 40px. */
  svg { width: 240px; height: 240px; }
</style>
</head>
<body>
  <div class="tile">
    <svg viewBox="0 0 40 40" fill="none" stroke="#fafafa" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 7l10 7-10 7"/>
      <path d="M18 19l10 7-10 7"/>
      <path d="M30 33h5"/>
    </svg>
  </div>
</body>
</html>
