# Posts each release to #activity on the Zorvolabs Discord.
# `released` fires when a release is published and when a prerelease is later marked as a release;
# drafts (scripts/sign-release.mjs makes one before publishing) and prereleases post nothing.
# It holds a repository secret, so it runs no project code and asks for no token permissions;
# scripts/discord-release-workflow.test.mjs keeps it that way.
name: Discord release post

on:
  release:
    types: [released]

permissions: {}

jobs:
  post:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          # Long notes are cut at the last line break before 1,500 characters, so no link or list item is split.
          # Empty notes leave the description out: Discord refuses an empty one.
          jq -n --arg tag "$TAG" --arg url "$URL" --arg body "$BODY" '
            ($body
              | if length > 1500
                then .[0:1500] | .[0:(rindex("\n") // 1500)] + "\n\n[Read the full notes](\($url))"
                else .
                end) as $text
            | {
                allowed_mentions: { parse: [] },
                embeds: [{ title: "Zorvo \($tag)", url: $url } + (if $text == "" then {} else { description: $text } end)]
              }' |
            curl --silent --show-error --fail-with-body --retry 3 \
              -H 'Content-Type: application/json' --data @- "$WEBHOOK"
